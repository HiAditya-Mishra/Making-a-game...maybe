<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Deutsch Quest</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="start-screen" id="startScreen">
            <div class="start-screen-content">
                <h1>Deutsch QUEST</h1>
                <p>Choose a category:</p>

                <div class="category-buttons">
                    <button onclick="startGame('greetings')">Greetings</button>
                    <button onclick="startGame('numbers')">Numbers</button>
                    <button onclick="startGame('food')">Food</button>
                    <button onclick="startGame('verbs')">Verbs</button>
                    <button onclick="startGame('mixed')">Mixed</button>
                </div>
            </div>
        </div>
        <div class="game" id="gameScreen">
            <h1>Deutsch QUEST</h1>
            <p id="score">SCORE: 0</p>
            <p id="questionNumber"></p>
            
            <p id="question">Question</p>

            <div id="optionsContainer"></div>

            <p id="result"></p>
        </div>

        <script src="game.js"></script>
    </body>
</html>
